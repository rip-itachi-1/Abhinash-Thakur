<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Use of colspan</title>
</head>
<body>
<table border="1">
	<tr>
		<td colspan="4">1</td>
	</tr>
	<tr>
		<td>2</td>
		<td>3</td>
		<td>4</td>
		<td>5</td>
	</tr>
	<tr>
		<td colspan="2">6</td>
		<td colspan="2">7</td>
	</tr>
	<tr>
		<td>8</td>
		<td colspan="2">9</td>
		<td>10</td>
	</tr>
</body>
</html>
