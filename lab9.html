<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ordered list</title>
</head>
<body>
	<h2>Input device</h2>
	<ol type="1">
		<li>mouse</li>
		<li>keyboard</li>
		<li>scanner</li>
		<li>mic</li>
	</ol>
	
	<hr>
<h2>Animals</h2>

	<ol type="A">
			<li>Dog</li>
			<li>Cat</li>
			<li>Lion</li>
			<li>Tiger</li>
	</ol>
	
	<hr>
	<h2>Birds</h2>

	<ol type="a">
			<li>Crow</li>
			<li>Parrot</li>
			<li>Eagle</li>
			<li>pigeon</li>
	</ol>
	
	<hr>
	
	</ol>
	
	<h2>Flower</h2>

	<ol type="I">
			<li>Rose</li>
			<li>tulip</li>
			<li>lily</li>
			<li>lotus</li>
</body>
</html>
