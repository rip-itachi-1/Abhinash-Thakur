<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unordered list</title>
</head>
<body>
<h2>Animals</h2>
<ul type="circle">
	<li>Cat</li>
	<li>Rat</li>
	<li>Dog</li>
	<li>Rabbit</li>
</ul>
<hr>
<h2>Birds</h2>
<ul type="disc">
	<li>crow</li>
	<li>eagle</li>
	<li>parrot</li>
</ul>
<hr>
<h2>Flowers</h2>
<ul type="square">
	<li>Rose</li>
	<li>sunflower</li>
	<li>tulip</li>
	<li>lily</li>
</ul>
<hr>

	<li>Animals
		<ul type="square">
			<li>Cow</li>
			<li>Rat</li>
			<li>Cat</li>
		</ul>
	</li>
	<hr>
<li>Birds
		<ul type="disc">
			<li>Crow</li>
			<li>sparrow</li>
			<li>parrot</li>
		</ul>
	</li>
	<hr>
	<li>Flowers
		<ul type="circle">
			<li>Rose</li>
			<li>Tulip</li>
			<li>Sunflower</li>
			<li>Marigold</li>
		</ul>
	</li>
	<hr>
</body>
</html>
