<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
 <script>
 	var a=parseInt(prompt("Enter your first Num:")) 
 	var b=parseInt(prompt("Enter your second Num:"))
 	let sum=a+b
 	var diff=a-b
 	multi=a*b
 	div=a/b
 	document.write("the sum of "+a+" and "+b+" is "+sum+"<br>");
 	document.write("the diff of "+a+" and "+b+" is "+diff+"<br>");
 	document.write("the multi of "+a+" and "+b+" is "+multi+"<br>");
 	document.write("the div of "+a+" and "+b+" is "+div);
 </script>
</body>
</html>
